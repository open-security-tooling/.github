name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** See the [security policy](https://github.com/open-security-tooling/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or config. Redact any secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tool version or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, runtime version
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Logs or error output. Redact any secrets.
      render: shell
